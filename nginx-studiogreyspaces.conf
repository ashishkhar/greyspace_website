# Place on the host at 203.57.85.33 (e.g. /etc/nginx/sites-available/studiogreyspaces.com).
# Points studiogreyspaces.com → Node on port 3005 (pm2 / ecosystem.config.cjs).
#
# After DNS A record: studiogreyspaces.com → 203.57.85.33
#   sudo certbot --nginx -d studiogreyspaces.com

server {
    listen 80;
    listen [::]:80;
    server_name studiogreyspaces.com;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
